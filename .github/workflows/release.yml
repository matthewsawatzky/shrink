name: Release fallback

# Normal releases run locally. Use this only when local publishing is unavailable.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.tag }}
  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate and extract changelog
        run: ./scripts/release-notes.sh "$RELEASE_TAG" > "$RUNNER_TEMP/shrink-notes.txt"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Build all platforms
        run: ./build.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Publish complete release
        run: ./scripts/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/shrink-notes.txt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
